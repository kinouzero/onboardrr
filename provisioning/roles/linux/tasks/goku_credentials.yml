---
- name: Validate the Goku mount settings
  ansible.builtin.assert:
    that:
      - onboardrr_nfs_source is defined
      - onboardrr_nfs_source is match('^[a-zA-Z0-9.-]+:/[a-zA-Z0-9_./-]+$')
    fail_msg: A valid NFS source is required for Periphery storage.

- name: Validate additional server SMB sources
  ansible.builtin.assert:
    that:
      - onboardrr_profile | default('raspberry-pi') == 'server'
      - item.key in ['dev', 'downloads', 'plex']
      - item.value is match('^//[a-zA-Z0-9.-]+/[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$')
      - item.value is not search('/\.\.?(/|$)')
    fail_msg: Provide a valid SMB share or subdirectory for each optional server mount.
  loop: "{{ onboardrr_optional_mounts | default({}) | dict2items }}"

- name: Install the per-device credential file from OpenBao
  when: onboardrr_managed_smb_credentials | default(false) | bool
  vars:
    onboardrr_smb_content: |
      username={{ onboardrr_smb_username_b64 | b64decode }}
      password={{ onboardrr_smb_password_b64 | b64decode }}
    onboardrr_smb_marker: "{{ onboardrr_smb_credentials_file }}.onboardrr"
  block:
    - name: Validate the managed credentials and destination
      ansible.builtin.assert:
        that:
          - onboardrr_smb_credentials_file == '/etc/onboardrr/' ~ onboardrr_name ~ '-goku.smb'
          - onboardrr_smb_username_b64 is match('^[A-Za-z0-9+/]+={0,2}$')
          - onboardrr_smb_password_b64 is match('^[A-Za-z0-9+/]+={0,2}$')
          - not (onboardrr_smb_username_b64 | b64decode is search('[\r\n]'))
          - not (onboardrr_smb_password_b64 | b64decode is search('[\r\n]'))
      no_log: true

    - name: Create the controller-managed credentials directory
      ansible.builtin.file:
        path: /etc/onboardrr
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the target-side SMB credentials
      when: not ansible_check_mode
      block:
        - name: Inspect existing credentials without following links
          ansible.builtin.stat:
            path: "{{ onboardrr_smb_credentials_file }}"
            follow: false
            checksum_algorithm: sha256
          register: onboardrr_existing_smb
          no_log: true

        - name: Inspect the device ownership marker
          ansible.builtin.stat:
            path: "{{ onboardrr_smb_marker }}"
            follow: false
            get_checksum: false
          register: onboardrr_existing_smb_marker

        - name: Verify previously managed credentials before refreshing them
          when: onboardrr_existing_smb_marker.stat.exists
          no_log: true
          block:
            - name: Require a private root-owned marker
              ansible.builtin.assert:
                that:
                  - onboardrr_existing_smb_marker.stat.isreg
                  - onboardrr_existing_smb_marker.stat.uid == 0
                  - onboardrr_existing_smb_marker.stat.mode == '0600'
                  - onboardrr_existing_smb_marker.stat.nlink == 1
                  - onboardrr_existing_smb_marker.stat.size <= 1024

            - name: Read the ownership marker privately
              ansible.builtin.slurp:
                src: "{{ onboardrr_smb_marker }}"
              register: onboardrr_smb_marker_bytes

            - name: Require the same device and known credential content
              ansible.builtin.assert:
                that:
                  - onboardrr_smb_identity.device_id == onboardrr_device_id
                  - onboardrr_smb_identity.sha256 is match('^[0-9a-f]{64}$')
                  - not onboardrr_existing_smb.stat.exists or onboardrr_existing_smb.stat.isreg
                  - >-
                    not onboardrr_existing_smb.stat.exists or
                    onboardrr_existing_smb.stat.checksum in
                    [onboardrr_smb_identity.sha256, onboardrr_smb_content | hash('sha256')]
              vars:
                onboardrr_smb_identity: "{{ onboardrr_smb_marker_bytes.content | b64decode | from_json }}"

        - name: Store private credentials for the mount helper
          ansible.builtin.copy:
            content: "{{ onboardrr_smb_content }}"
            dest: "{{ onboardrr_smb_credentials_file }}"
            owner: root
            group: root
            mode: "0600"
            follow: false
          no_log: true
          diff: false

        - name: Record the newly created or previously managed credentials
          ansible.builtin.copy:
            content: "{{ {'device_id': onboardrr_device_id, 'sha256': onboardrr_smb_content | hash('sha256')} | to_json }}"
            dest: "{{ onboardrr_smb_marker }}"
            owner: root
            group: root
            mode: "0600"
            follow: false
          no_log: true
          diff: false
          when:
            - onboardrr_device_id | default('') is match('^[0-9a-f-]{36}$')
            - not onboardrr_existing_smb.stat.exists or onboardrr_existing_smb_marker.stat.exists

- name: Verify the SMB credentials file before mounting
  when:
    - onboardrr_optional_mounts | default({}) | length > 0
    - not ansible_check_mode or not (onboardrr_managed_smb_credentials | default(false) | bool)
  block:
    - name: Check the prepared SMB credentials file
      ansible.builtin.stat:
        path: "{{ onboardrr_smb_credentials_file }}"
        follow: false
      register: onboardrr_smb_file
      no_log: true

    - name: Require private SMB credentials
      ansible.builtin.assert:
        that:
          - onboardrr_smb_file.stat.isreg | default(false)
          - onboardrr_smb_file.stat.uid == 0
          - onboardrr_smb_file.stat.mode in ['0400', '0600']
        fail_msg: Provide a root-owned SMB credentials file with mode 0400 or 0600.
