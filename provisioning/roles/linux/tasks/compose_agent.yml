---
- name: Resolve the OpenBao Compose settings for this host
  ansible.builtin.set_fact:
    onboardrr_openbao_directory: "{{ onboardrr_home }}/.config/docker/openbao"
    onboardrr_legacy_compose_directory: "{{ onboardrr_home }}/.config/docker/compose-openbao"
    onboardrr_openbao_internal_endpoint: "{{ onboardrr_openbao_internal_endpoints.get(onboardrr_name, {}) }}"
    onboardrr_openbao_host_ip: >-
      {{ onboardrr_compose_agent.host_ip | default('', true)
         or (ansible_facts.default_ipv4 | default({})).get('address')
         or ansible_host | default('') }}
    onboardrr_openbao_docker_api_port: >-
      {{ onboardrr_compose_agent.docker_api_port
         if onboardrr_compose_agent.docker_api_port | default(none) is not none
         else onboardrr_docker_api_port }}

- name: Validate the OpenBao Agent host parameters
  ansible.builtin.assert:
    that:
      - onboardrr_openbao_host_ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - onboardrr_openbao_host_ip.split('.') | map('int') | max <= 255
      - onboardrr_home is match('^/[^\r\n]+$') and '..' not in onboardrr_home.split('/')
      - onboardrr_openbao_docker_api_port | string is match('^[0-9]{1,5}$')
      - onboardrr_openbao_docker_api_port | int in range(1, 65536)
    fail_msg: Provide a valid host IPv4 address, Docker API port, and local operator home for the OpenBao Agent.

- name: Inspect the existing legacy Compose cache
  ansible.builtin.stat:
    path: "{{ onboardrr_legacy_compose_directory }}/cache"
    follow: false
  register: onboardrr_legacy_compose_cache
  when: onboardrr_compose_agent.uses_legacy_templates | default(false)

- name: Inspect the standard Compose cache path
  ansible.builtin.stat:
    path: "{{ onboardrr_openbao_directory }}/compose/cache"
    follow: false
  register: onboardrr_standard_compose_cache
  when: onboardrr_legacy_compose_cache.stat.isdir | default(false)

- name: Choose the Compose Agent directory
  ansible.builtin.set_fact:
    onboardrr_direct_agent_directory: >-
      {{ onboardrr_legacy_compose_directory
         if onboardrr_legacy_compose_cache.stat.isdir | default(false)
         and onboardrr_legacy_compose_cache.stat.uid == onboardrr_account[1] | int
         and (not (onboardrr_standard_compose_cache.stat.exists | default(false))
              or onboardrr_standard_compose_cache.stat.lnk_target | default('') == onboardrr_legacy_compose_directory ~ '/cache')
         else onboardrr_openbao_directory ~ '/compose' }}

- name: Configure the operator's OpenBao Compose project
  become: false
  remote_user: "{{ onboardrr_user }}"
  when: not ansible_check_mode
  block:
    - name: Create the private OpenBao directory
      ansible.builtin.file:
        path: "{{ onboardrr_openbao_directory }}"
        state: directory
        mode: "0700"
        follow: false
    - name: Write the host variables used to resolve the OpenBao Agent Compose
      ansible.builtin.copy:
        dest: "{{ onboardrr_openbao_directory }}/compose.env"
        content: |
          URL_BAO={{ onboardrr_compose_agent.url | to_json }}
          DOCKER_HOSTNAME={{ onboardrr_name }}
          HOST_IP={{ onboardrr_openbao_host_ip }}
          DOCKER_API_PORT={{ onboardrr_openbao_docker_api_port | int }}
        mode: "0600"
        follow: false

- name: Install the OpenBao Agent for direct Compose
  ansible.builtin.include_tasks: install_openbao_agent.yml
  vars:
    onboardrr_agent_variant: compose
    onboardrr_agent_directory: "{{ onboardrr_direct_agent_directory }}"
    onboardrr_agent_output: cache
    onboardrr_agent_previous_project: onboardrr-openbao-agent
    onboardrr_agent_credentials: "{{ onboardrr_compose_agent }}"
    onboardrr_agent_files: "{{ onboardrr_compose_agent.projects | map('regex_replace', '$', '.env') | list }}"
  when: not ansible_check_mode

- name: Make the restored cache available at the standard Compose path
  become: false
  remote_user: "{{ onboardrr_user }}"
  when:
    - not ansible_check_mode
    - onboardrr_direct_agent_directory == onboardrr_legacy_compose_directory
  block:
    - name: Create the standard private Compose directory
      ansible.builtin.file:
        path: "{{ onboardrr_openbao_directory }}/compose"
        state: directory
        mode: "0700"
        follow: false

    - name: Link the standard cache to the existing host cache
      ansible.builtin.file:
        src: "{{ onboardrr_direct_agent_directory }}/cache"
        path: "{{ onboardrr_openbao_directory }}/compose/cache"
        state: link
        follow: false

- name: Update the managed Compose project state
  when: not ansible_check_mode
  block:
    - name: Prepare the root-owned Compose project state directory
      ansible.builtin.file:
        path: /var/lib/onboardrr
        state: directory
        owner: root
        group: root
        mode: "0755"
        follow: false

    - name: Inspect the previous managed project manifest
      ansible.builtin.stat:
        path: /var/lib/onboardrr/compose-agent-projects.json
        follow: false
      register: onboardrr_agent_previous_manifest

    - name: Verify permissions on the previous managed project manifest
      ansible.builtin.assert:
        that:
          - onboardrr_agent_previous_manifest.stat.isreg
          - onboardrr_agent_previous_manifest.stat.uid == 0
          - onboardrr_agent_previous_manifest.stat.mode == '0644'
      when: onboardrr_agent_previous_manifest.stat.exists

    - name: Read the previous managed project manifest
      ansible.builtin.slurp:
        src: /var/lib/onboardrr/compose-agent-projects.json
      register: onboardrr_agent_previous
      when: onboardrr_agent_previous_manifest.stat.exists

    - name: Parse the previous managed project manifest
      ansible.builtin.set_fact:
        onboardrr_agent_previous_state: "{{ onboardrr_agent_previous.content | default('W10=') | b64decode | from_json }}"

    - name: Remove superseded files from the operator-owned managed Compose cache
      ansible.builtin.file:
        path: "{{ onboardrr_direct_agent_directory }}/cache/{{ item }}.env"
        state: absent
      become: false
      remote_user: "{{ onboardrr_user }}"
      loop: "{{ onboardrr_agent_previous_state.projects | default([]) }}"
      when:
        - onboardrr_agent_previous_state.cache | default('') == (onboardrr_openbao_directory ~ '/compose/cache')
        - item is match('^[a-z0-9][a-z0-9_-]{0,127}$')
        - item not in onboardrr_compose_agent.projects

    - name: Find the previous managed OpenBao container
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - ps
          - --quiet
          - --no-trunc
          - --filter
          - label=com.docker.compose.project=onboardrr-openbao-agent
          - --filter
          - "label=com.docker.compose.service={{ item.service }}"
          - --filter
          - "label=com.docker.compose.project.config_files={{ item.config }}"
      loop:
        - service: agent
          config: /var/lib/onboardrr/compose-agent/compose.yml
        - service: openbao-agent
          config: "{{ onboardrr_openbao_directory }}/compose.yaml"
      register: onboardrr_agent_legacy
      changed_when: false

    - name: Stop the replaced managed agent after the new cache is ready
      ansible.builtin.command:
        argv: [docker, --host, unix:///var/run/docker.sock, stop, "--", "{{ item }}"]
      loop: "{{ onboardrr_agent_legacy.results | map(attribute='stdout_lines') | flatten }}"

    - name: Record the projects and agent cache used by dcu
      ansible.builtin.copy:
        dest: /var/lib/onboardrr/compose-agent-projects.json
        content: >-
          {{ {'projects': onboardrr_compose_agent.projects, 'cache': onboardrr_openbao_directory ~ '/compose/cache',
              'uid': onboardrr_account[1] | int} | to_json }}
        owner: root
        group: root
        mode: "0644"
        follow: false

- name: Find the existing Komodo render directory
  ansible.builtin.stat:
    path: "{{ onboardrr_home }}/.docker/komodo-openbao/rendered"
    follow: false
  register: onboardrr_legacy_komodo_render
  when: (onboardrr_compose_agent.komodo | default({})).uses_legacy_template | default(false)

- name: Choose the Komodo Agent directory
  ansible.builtin.set_fact:
    onboardrr_komodo_agent_directory: >-
      {{ onboardrr_home ~ '/.docker/komodo-openbao'
         if onboardrr_legacy_komodo_render.stat.isdir | default(false)
         and onboardrr_legacy_komodo_render.stat.uid == onboardrr_account[1] | int
         else onboardrr_openbao_directory ~ '/komodo' }}
  when: onboardrr_compose_agent.komodo is defined

- name: Install the OpenBao Agent for Komodo Core
  ansible.builtin.include_tasks: install_openbao_agent.yml
  vars:
    onboardrr_agent_variant: komodo
    onboardrr_agent_directory: "{{ onboardrr_komodo_agent_directory }}"
    onboardrr_agent_output: rendered
    onboardrr_agent_previous_project: onboardrr-openbao-agent-komodo
    onboardrr_agent_credentials: "{{ onboardrr_compose_agent.komodo }}"
    onboardrr_agent_files: [core.config.toml]
  when: not ansible_check_mode and onboardrr_compose_agent.komodo is defined

- name: Generate the Komodo Core override
  become: false
  remote_user: "{{ onboardrr_user }}"
  when: not ansible_check_mode and onboardrr_compose_agent.komodo is defined
  block:
    - name: Create the private directory for the generated Core override
      ansible.builtin.file:
        path: "{{ onboardrr_openbao_directory }}/komodo"
        state: directory
        mode: "0700"
        follow: false

    - name: Install the Komodo Core configuration watcher
      ansible.builtin.copy:
        src: watch-komodo-core.sh
        dest: "{{ onboardrr_openbao_directory }}/komodo/watch-core.sh"
        mode: "0644"
        follow: false

    - name: Install the Compose override for the Komodo Core service
      ansible.builtin.template:
        src: komodo-core.openbao.yaml.j2
        dest: "{{ onboardrr_openbao_directory }}/komodo/core.override.yaml"
        mode: "0600"
        follow: false
